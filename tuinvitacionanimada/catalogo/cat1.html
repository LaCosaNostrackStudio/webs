<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Galería 3x3 centrada</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #25015A;
            display: flex;
            justify-content: center;
        }

        .contenedor {
            width: 1050px;
            height: 2130px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 40px; /* Espacio uniforme entre imágenes */
            box-sizing: border-box;
        }

        .contenedor a {
            display: block;
        }

        .contenedor img {
            width: 313px;
            height: 671px;
            display: block;
        }
    </style>
</head>
<body>
    <div class="contenedor">
        <a href="1.mp4" target="_blank"><img src="1.jpg" alt="Imagen 1"></a>
        <a href="2.mp4" target="_blank"><img src="2.jpg" alt="Imagen 2"></a>

        <a href="4.mp4" target="_blank"><img src="4.jpg" alt="Imagen 4"></a>
        <a href="5.mp4" target="_blank"><img src="5.jpg" alt="Imagen 5"></a>
        <a href="6.mp4" target="_blank"><img src="6.jpg" alt="Imagen 6"></a>
        <a href="7.mp4" target="_blank"><img src="7.jpg" alt="Imagen 7"></a>
        <a href="8.mp4" target="_blank"><img src="8.jpg" alt="Imagen 8"></a>
        <a href="9.mp4" target="_blank"><img src="9.jpg" alt="Imagen 9"></a>
    </div>
</body>
</html>
