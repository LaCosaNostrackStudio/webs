<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Brooklyn Mill And Door</title>
    <style>
        /* Estilos para el contenedor de iframes */
        .iframe-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        /* Estilos para los iframes */
        .iframe-container iframe {
            border: none;
            margin: 0;
            margin-bottom: 0px;
            opacity: 0;
            transition: opacity 2s ease-in-out;
        }
        .iframe-container iframe[data-loaded="true"] {
            opacity: 1;
        }
        /* Estilo para el fondo de la página */
        body {
            background-color: #FFFFFF;
        }

        /* Estilos para el fondo oscuro del modal */
        #modalOverlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 1000;
        }

        /* Estilos para el contador de fotos */
        #photoCounter {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 24px;
            font-weight: bold;
            color: #FFFFFF;
            background-color: rgba(0, 0, 0, 0.6);
            padding: 8px;
            border-radius: 8px;
        }

        /* Estilos para la imagen en el modal */
        #modalContent {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 80%;
            max-height: 80%;
            border-radius: 8px;
            overflow: hidden;
            background-color: white;
        }
        #modalContent img {
            width: 100%;
            height: auto;
            border: 10px solid white;
            box-sizing: border-box;
            opacity: 0;
            transform: translateX(100%);
            transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
        }

        /* Estilo para el botón de cierre */
        #closeModal {
            position: absolute;
            top: -20px;
            right: 10px;
            font-size: 100px;
            font-weight: bold;
            color: #CF2226;
            cursor: pointer;
            z-index: 1010;
        }

        /* Estilos para los botones de navegación */
        .navButton {
            position: absolute;
            top: 50%;
            font-size: 100px;
            color: #CF2226;
            cursor: pointer;
            z-index: 10;
            user-select: none;
            transform: translateY(-50%);
        }

        #navLeft {
            left: 10px;
        }

        #navRight {
            right: 10px;
        }

        /* Ajustes para dispositivos móviles */
        @media (max-width: 1000px) {
            #modalContent {
                width: 100%;
                height: auto;
                max-width: 100%;
                max-height: 100%;
            }
            #modalContent img {
                width: 100%;
                height: auto;
            }
        }
    </style>
</head>

<body>
    <div class="iframe-container">
        <iframe data-src="top.html" width="1050" height="180"></iframe>
        <iframe data-src="productcanvas.html" width="1050" height="1332"></iframe>

        let currentIndex = 0;

        // Función para mostrar la imagen en el modal
        function showImage(index, direction) {
            const modalImage = document.getElementById("modalImage");
            const photoCounter = document.getElementById("photoCounter");

     
			
			 // Actualiza la imagen y el contador, agregando un timestamp para evitar caché
    		modalImage.src = images[index] + '?' + new Date().getTime();
    		photoCounter.textContent = `${index + 1}/${images.length}`;
			
			
			
            // Resetear la transición para la imagen actual
            modalImage.style.transition = 'none';
            modalImage.style.transform = direction === 'left' ? 'translateX(100%)' : 'translateX(-100%)';
            modalImage.style.opacity = 0;

            // Espera a que la imagen se cargue antes de animarla
            modalImage.onload = () => {
                setTimeout(() => {
                    modalImage.style.transition = 'opacity 0.5s ease-in-out, transform 0.5s ease-in-out';
                    modalImage.style.transform = 'translateX(0)';
                    modalImage.style.opacity = 1;
                }, 50);
            };

            updateNavButtons();
        }

        // Actualiza el estado de los botones de navegación
        function updateNavButtons() {
            const navLeft = document.getElementById("navLeft");
            const navRight = document.getElementById("navRight");

            navLeft.style.display = currentIndex === 0 ? "none" : "block";
            navRight.style.display = currentIndex === images.length - 1 ? "none" : "block";
        }

        // Muestra el modal y la primera imagen
        function openModal() {
            document.getElementById("modalOverlay").style.display = "block";
            // Asegura que el contador esté visible
            document.getElementById("photoCounter").style.display = "block";
            showImage(currentIndex, 'left');
        }

        // Cerrar el modal al hacer clic en el botón de cierre
        document.getElementById("closeModal").addEventListener("click", function() {
            document.getElementById("modalOverlay").style.display = "none";
        });

        // Cerrar el modal si el usuario hace clic fuera de la imagen
        document.getElementById("modalOverlay").addEventListener("click", function(event) {
            if (event.target === document.getElementById("modalOverlay")) {
                document.getElementById("modalOverlay").style.display = "none";
            }
        });

        // Botón de navegación izquierda
        document.getElementById("navLeft").addEventListener("click", function() {
            if (currentIndex > 0) {
                currentIndex--;
                showImage(currentIndex, 'right');
            }
        });

        // Botón de navegación derecha
        document.getElementById("navRight").addEventListener("click", function() {
            if (currentIndex < images.length - 1) {
                currentIndex++;
                showImage(currentIndex, 'left');
            }
        });

        // Simulación de un mensaje para abrir el modal desde otro lugar
 window.addEventListener("message", function(event) {
    if (event.data.action === "openModal") {
        // Remueve el parámetro de número aleatorio al comparar la URL
        const cleanUrl = event.data.imageUrl.split('?')[0];
        currentIndex = images.findIndex(image => image === cleanUrl);
        if (currentIndex >= 0) {
            openModal();
        }
    }
});
        // Cargar los iframes cuando la página cargue
        window.addEventListener('DOMContentLoaded', function() {
            const iframes = document.querySelectorAll('.iframe-container iframe');
            iframes.forEach(function(iframe) {
                iframe.src = iframe.getAttribute('data-src');
                iframe.setAttribute('data-loaded', 'true');
            });
        });
    </script>
