<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Brooklyn Mill And Door</title>
    <style>
        /* Estilos para el contenedor de iframes */
        .iframe-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        /* Estilos para los iframes */
        .iframe-container iframe {
            border: none;
            margin: 0;
            margin-bottom: 0px;
            opacity: 0;
            transition: opacity 2s ease-in-out;
        }
        .iframe-container iframe[data-loaded="true"] {
            opacity: 1;
        }
        /* Estilo para el fondo de la página */
        body {
            background-color: #FFFFFF;
        }

        /* Estilos para el fondo oscuro del modal */
        #modalOverlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 1000;
        }

        /* Estilos para la imagen en el modal */
        #modalContent {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 80%;
            max-height: 80%;
            border-radius: 8px;
            overflow: hidden;
            background-color: white;
        }
        #modalContent img {
            width: 100%;
            height: auto;
            border: 10px solid white; /* Borde blanco de 10 píxeles */
            box-sizing: border-box; /* Asegura que el borde esté incluido dentro del tamaño de la imagen */
            opacity: 0; /* Hacemos que la imagen empiece invisible */
            transform: translateX(100%); /* Empuja la imagen fuera de la pantalla */
            transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out; /* Añadimos el efecto de deslizamiento */
        }

        /* Estilo para el botón de cierre */
        #closeModal {
            position: absolute;
            top: -20px;
            right: 10px;
            font-size: 100px;
            font-weight: bold; /* Hace la "X" más gruesa */
            color: #CF2226;
            cursor: pointer;
            z-index: 1010; /* Asegura que el botón de cierre esté por encima de la imagen */
        }

        /* Estilos para los botones de navegación */
        .navButton {
            position: absolute;
            top: 50%;
            font-size: 100px;
            color: #CF2226;
            cursor: pointer;
            z-index: 10;
            user-select: none;
            transform: translateY(-50%);
        }

        #navLeft {
            left: 10px;
        }

        #navRight {
            right: 10px;
        }

        /* Ajustes para dispositivos móviles */
        @media (max-width: 1000px) {
            #modalContent {
                width: 100%;
                height: auto;
                max-width: 100%;
                max-height: 100%;
                border-radius: 8; /* Quita el borde redondeado para aprovechar todo el ancho */
            }
            #modalContent img {
                width: 100%;
                height: auto;
            }
        }
    </style>
</head>

<body>
    <div class="iframe-container">
        <iframe data-src="top.html" width="1050" height="180"></iframe>
        <iframe data-src="servicescanvas.html" width="1050" height="1098"></iframe>
        <iframe data-src="bot.html" width="1050" height="1200"></iframe>
    </div>

    <!-- HTML para el modal -->
    <div id="modalOverlay">
        <div id="modalContent">
            <span id="closeModal">&times;</span>
            <img id="modalImage" src="" alt="Imagen">
            <!-- Botones de navegación -->
            <span id="navLeft" class="navButton">&#10094;</span> <!-- Botón izquierdo -->
            <span id="navRight" class="navButton">&#10095;</span> <!-- Botón derecho -->
        </div>
    </div>

    <script>
        // Lista de imágenes
        const images = ["photos/f1.jpg", "photos/f2.jpg", "photos/f3.jpg", "photos/f4.jpg"];
        let currentIndex = 0;

        // Función para mostrar la imagen en el modal
        function showImage(index, direction) {
            const modalImage = document.getElementById("modalImage");
            modalImage.src = images[index];

            // Resetear la transición para la imagen actual
            modalImage.style.transition = 'none'; // Desactivamos la transición temporalmente
            modalImage.style.transform = direction === 'left' ? 'translateX(100%)' : 'translateX(-100%)'; // Empuja la imagen fuera de la pantalla
            modalImage.style.opacity = 0; // La hace invisible

            // Espera a que la imagen se cargue antes de animarla
            modalImage.onload = () => {
                setTimeout(() => {
                    // Añadimos la transición de entrada
                    modalImage.style.transition = 'opacity 0.5s ease-in-out, transform 0.5s ease-in-out'; 
                    modalImage.style.transform = 'translateX(0)'; // La imagen vuelve a su lugar
                    modalImage.style.opacity = 1; // La hace visible de nuevo
                }, 50);
            };

            updateNavButtons();
        }

        // Actualiza el estado de los botones de navegación
        function updateNavButtons() {
            const navLeft = document.getElementById("navLeft");
            const navRight = document.getElementById("navRight");

            // Oculta el botón de navegación izquierda si estamos en la primera imagen
            navLeft.style.display = currentIndex === 0 ? "none" : "block";
            // Oculta el botón de navegación derecha si estamos en la última imagen
            navRight.style.display = currentIndex === images.length - 1 ? "none" : "block";
        }

        // Muestra el modal y la primera imagen
        function openModal() {
            document.getElementById("modalOverlay").style.display = "block";
            showImage(currentIndex, 'left');
        }

        // Cerrar el modal al hacer clic en el botón de cierre
        document.getElementById("closeModal").addEventListener("click", function() {
            document.getElementById("modalOverlay").style.display = "none";
        });

        // Cerrar el modal si el usuario hace clic fuera de la imagen
        document.getElementById("modalOverlay").addEventListener("click", function(event) {
            if (event.target === document.getElementById("modalOverlay")) {
                document.getElementById("modalOverlay").style.display = "none";
            }
        });

        // Botón de navegación izquierda
        document.getElementById("navLeft").addEventListener("click", function() {
            if (currentIndex > 0) {
                currentIndex--;
                showImage(currentIndex, 'right');
            }
        });

        // Botón de navegación derecha
        document.getElementById("navRight").addEventListener("click", function() {
            if (currentIndex < images.length - 1) {
                currentIndex++;
                showImage(currentIndex, 'left');
            }
        });

        // Simulación de un mensaje para abrir el modal desde otro lugar
        window.addEventListener("message", function(event) {
            if (event.data.action === "openModal") {
                currentIndex = images.indexOf(event.data.imageUrl);
                openModal();
            }
        });

        // Cargar los iframes cuando la página cargue
        window.addEventListener('DOMContentLoaded', function() {
            const iframes = document.querySelectorAll('.iframe-container iframe');
            iframes.forEach(function(iframe) {
                iframe.src = iframe.getAttribute('data-src');
                iframe.setAttribute('data-loaded', 'true');
            });
        });
    </script>
</body>
</html>
