<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banner 728 × 90</title>
<style>
  html, body { margin: 0; padding: 0; }
  .banner { position: relative; width: 728px; height: 90px; overflow: hidden; }
  .banner img { position: absolute; inset: 0; width: 728px; height: 90px; opacity: 0; }
  .banner img:first-child { opacity: 1; }
</style>
</head>
<body>
<div class="banner" aria-label="Banner rotativo">
  <img src="imagen1.png" alt="Imagen 1">
  <img src="imagen2.png" alt="Imagen 2">
  <img src="imagen3.png" alt="Imagen 3">
  <img src="imagen4.png" alt="Imagen 4">
</div>
<script>
  const slides = Array.from(document.querySelectorAll('.banner img'));
  let current = 0;
  setInterval(() => {
    slides[current].style.opacity = '0';
    current = (current + 1) % slides.length;
    slides[current].style.opacity = '1';
  }, 3000);
</script>
</body>
</html>
