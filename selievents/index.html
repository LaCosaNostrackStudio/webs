<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    
    <meta property="og:title" content="Tu Invitación Animada">
    <meta property="og:description" content="">
    <meta property="og:image" content="https://lacosanostrackstudio.github.io/webs/selievents/flayer.jpg">
    <meta property="og:image:width" content="800">
    <meta property="og:image:height" content="1200">
    <title>Tu Invitación Animada</title>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #FFFFFF;
        }

        iframe {
            width: 1050px;
            border: none;
            display: block;
            margin: 0 auto;
            opacity: 0;
            transition: opacity 1s ease;
        }

        iframe.visible {
            opacity: 1;
        }
    </style>
</head>
<body>

    <!-- Reemplazamos src por data-src para cargarlo después -->
    <iframe data-src="web.html" height="1122"></iframe>
    <iframe data-src="banner1.jpg" height="420"></iframe>
    <iframe data-src="catalogo/cat1.html" height="2130"></iframe>
    <iframe data-src="catalogo/cat2.html" height="2130"></iframe>
    <iframe data-src="catalogo/cat3.html" height="1510"></iframe>
    <iframe data-src="goto.html" height="270"></iframe>
    <iframe data-src="banner.jpg" height="70"></iframe>
    <iframe data-src="footer.html" height="400"></iframe>

    <script>
        const iframes = document.querySelectorAll('iframe[data-src]');

        const observer = new IntersectionObserver((entries, observer) => {
            entries.forEach(entry => {
                if (entry.isIntersecting && entry.intersectionRatio >= 0.15) {
                    const iframe = entry.target;
                    iframe.src = iframe.dataset.src;
                    iframe.classList.add('visible');
                    observer.unobserve(iframe);
                }
            });
        }, {
            threshold: 0.15 // 15% visible
        });

        iframes.forEach(iframe => observer.observe(iframe));
    </script>

</body>
</html>
